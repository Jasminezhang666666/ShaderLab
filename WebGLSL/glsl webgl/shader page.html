<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shader!!</title>
    <style>
        body   { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh;   }
        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            text-align: center;
            font-size: 3rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.25);
            color: white;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas"></canvas>

    <!-- your landing page text -->
    <div id="overlay">
        <h1>Welcome. I'm Jaaaaasmine.(*´▽｀)ノノ</h1>
        <p>🤡🤣(*/ω＼*)</p>
    </div>

    <!-- 
        VERTEX SHADER 
        we are drawing triangles to cover the whole screen.
        no need to edit this.
    -->
    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec2 position;
        void main() { gl_Position = vec4(position, 0.0, 1.0); }
    </script>

    <!-- 
        FRAGMENT SHADER 
        edit the text between the <script></script> tags.
        sorry there is no syntax highlighting!
    -->
    <script id="fragment-shader" type="x-shader/x-fragment">
        precision mediump float;

        // screen size (width, height)
        uniform vec2 uResolution;
        
        // time in seconds since load
        uniform float uTime;

        vec3 palette(float d){
            return mix(vec3(0.2,0.7,0.9),vec3(1.,0.,1.),d);
        }

        vec2 rotate(vec2 p,float a){
            float c = cos(a);
            float s = sin(a);
            return p*mat2(c,s,-s,c);
        }

        float map(vec3 p){
            for( int i = 0; i<8; ++i){
                float t = uTime*0.2;
                p.xz =rotate(p.xz,t);
                p.xy =rotate(p.xy,t*1.89);
                p.xz = abs(p.xz);
                p.xz-=.5;
            }
            return dot(sign(p),p)/5.;
        }

        vec4 rm (vec3 ro, vec3 rd){
            float t = 0.;
            vec3 col = vec3(0.);
            float d;
            for(int i =0; i<64; i++){
                vec3 p = ro + rd*t;
                d = map(p)*.5;
                if(d<0.02){
                    break;
                }
                if(d>100.){
                    break;
                }
                //col+=vec3(0.6,0.8,0.8)/(400.*(d));
                col+=palette(length(p)*.1)/(400.*(d));
                t+=d;
            }
            return vec4(col,1./(d*100.));
        }

        void mainImage( out vec4 fragColor, in vec2 fragCoord )
        {
            vec2 uv = (fragCoord-(uResolution.xy/2.))/uResolution.x;
            vec3 ro = vec3(0.,0.,-50.);
            ro.xz = rotate(ro.xz,uTime);
            vec3 cf = normalize(-ro);
            vec3 cs = normalize(cross(cf,vec3(0.,1.,0.)));
            vec3 cu = normalize(cross(cf,cs));
            
            vec3 uuv = ro+cf*3. + uv.x*cs + uv.y*cu;
            
            vec3 rd = normalize(uuv-ro);
            
            vec4 col = rm(ro,rd);
            fragColor = col;
        }

        void main() {
            // normalize coordinates 0 - 1
            //vec2 uv = gl_FragCoord.xy / uResolution;

            //vec3 color = vec3(sin(uTime) * 0.5 + 0.5, uv.x, uv.y);
            
            vec4 color;
            mainImage(color, gl_FragCoord.xy);
            gl_FragColor = color;
        }
    </script>

    <!-- javascript file with basic webgl implementation -->
    <script src="webgl-engine.js"></script>
</body>
</html>
